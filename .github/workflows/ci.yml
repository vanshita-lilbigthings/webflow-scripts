name: Webflow Scripts CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx eslint src/

  format:
    name: Prettier Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx prettier --check src/

  build:
    name: Build and Minify
    runs-on: ubuntu-latest
    needs: [lint, format]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  deploy:
    name: Deploy to Webflow
    runs-on: ubuntu-latest
    needs: [build, test-api]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - name: Download built dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Commit and push dist to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f dist/
          git diff --staged --quiet || git commit -m "chore: update dist [skip ci]"
          git pull --rebase origin main
          git push
          echo "DEPLOY_SHA=$(git rev-parse HEAD)" >> $GITHUB_ENV

      - name: Verify dist files exist at DEPLOY_SHA
        run: |
          echo "DEPLOY_SHA=${{ env.DEPLOY_SHA }}"
          echo "--- dist/ on disk ---"
          ls dist/
          echo "--- dist/ in git at DEPLOY_SHA ---"
          git ls-tree -r ${{ env.DEPLOY_SHA }} --name-only | grep "^dist/"
          echo "--- checking each file ---"
          MISSING=0
          for f in dist/*.iife.js; do
            fname=$(basename "$f")
            if git ls-tree -r ${{ env.DEPLOY_SHA }} --name-only | grep -q "^dist/${fname}$"; then
              echo "OK   dist/${fname}"
            else
              echo "MISSING   dist/${fname}"
              MISSING=1
            fi
          done
          [ "$MISSING" -eq 0 ] || { echo "ERROR: files missing from commit. Deploy_SHA is wrong."; exit 1; }

      - name: Register and apply script to Webflow
        env:
          WEBFLOW_ACCESS_TOKEN: ${{ secrets.WEBFLOW_ACCESS_TOKEN }}
          WEBFLOW_SITE_ID: ${{ secrets.WEBFLOW_SITE_ID }}
          WEBFLOW_SITE_TOKEN: ${{ secrets.WEBFLOW_SITE_TOKEN }}
          DEPLOY_SHA: ${{ env.DEPLOY_SHA }}
        run: node deploy.js

  test-api:
    name: Run API Tests
    runs-on: ubuntu-latest
    needs: [build]
    env:
      WEBFLOW_ACCESS_TOKEN: ${{ secrets.WEBFLOW_ACCESS_TOKEN }}
      WEBFLOW_SITE_ID: ${{ secrets.WEBFLOW_SITE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Run API Tests
        run: npm test

  test-browser:
    name: Run Browser Tests
    runs-on: ubuntu-latest
    needs: [deploy]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx playwright install chromium
      - name: Run Browser Tests
        run: npm run test:browser
